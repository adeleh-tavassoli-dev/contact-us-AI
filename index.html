<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - StackCraft Studios</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/62828df5c5.js"
      crossorigin="anonymous"
    ></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <div class="content">
        <!-- Contact Details (Left Side) -->
        <section class="left-side">
          <div class="address details">
            <span class="icon"><i class="fas fa-map-marker-alt"></i></span>
            <h3 class="topic">Address</h3>
            <p class="text-one">350 5th Ave, Suite 300</p>
            <p class="text-two">New York, NY 10118</p>
          </div>

          <div class="phone details">
            <span class="icon"><i class="fas fa-phone-alt"></i></span>
            <h3 class="topic">Phone</h3>
            <p class="text-one"><a href="tel:2125550199">(212) 555-0199</a></p>
            <p class="text-two"><a href="tel:3125550598">(312) 555-0598</a></p>
          </div>

          <div class="email details">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <h3 class="topic">E-mail</h3>
            <p class="text-one">
              <a href="mailto:StackCraft_Studios@gmail.com"
                >StackCraft_Studios@gmail.com</a
              >
            </p>
            <p class="text-two">
              <a href="mailto:info.StackCraft_Studios@gmail.com"
                >info.StackCraft_Studios@gmail.com</a
              >
            </p>
          </div>
        </section>

        <!-- Contact Form (Right Side) -->
        <section class="right-side">
          <h2 class="topic-text">Get in Touch</h2>
          <p class="description">
            Have a question or looking to build a new website? Send us a message
            and our team will get back to you shortly.
          </p>

          <form action="#" method="POST">
            <div class="input-box">
              <input
                type="text"
                name="full_name"
                id="full_name"
                placeholder="Name"
                aria-label="Name"
                required
              />
            </div>
            <div class="input-box">
              <input
                type="email"
                name="email"
                id="email"
                placeholder="E-mail"
                aria-label="E-mail"
                required
              />
            </div>
            <div class="input-box message-box">
              <textarea
                name="message"
                id="message"
                placeholder="Enter your message..."
                aria-label="Message"
                required
              ></textarea>
            </div>
            <div class="button">
              <button type="submit">Submit Inquiry</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
